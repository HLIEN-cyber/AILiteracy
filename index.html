<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Literacy</title>
  <style>
    :root {
      --bg: #030712;
      --bg-soft: #081127;
      --text: #f3f8ff;
      --muted: #a8c4f2;
      --glass: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(173, 221, 255, 0.28);
      --accent: #69e9ff;
      --accent-2: #7f8cff;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "SF Pro Display", "Inter", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 15% 20%, #11295f 0%, transparent 40%),
                  radial-gradient(circle at 85% 25%, #2f2d6a 0%, transparent 35%),
                  linear-gradient(180deg, #02050d 0%, #070d1d 50%, #030712 100%);
      overflow-x: hidden;
    }

    .particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.85;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 8vh 1.2rem 4rem;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .glass {
      width: min(1120px, 94vw);
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      backdrop-filter: blur(22px) saturate(130%);
      -webkit-backdrop-filter: blur(22px) saturate(130%);
      box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,0.25);
      padding: clamp(1.6rem, 4vw, 3rem);
    }

    .kicker {
      letter-spacing: .34em;
      text-transform: uppercase;
      color: #bde9ff;
      font-size: .77rem;
      margin: 0 0 .8rem;
      opacity: .8;
      animation: fadeUp 1.1s cubic-bezier(.22,.61,.36,1) both;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7.2vw, 6rem);
      line-height: 1;
      font-weight: 700;
      background: linear-gradient(130deg, #ffffff 20%, #82d4ff 58%, #9f9dff 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: chromaShift 10s ease-in-out infinite alternate;
    }

    .animated-typing {
      margin: 1rem auto 1.4rem;
      width: fit-content;
      color: var(--muted);
      font-size: clamp(1.08rem, 2.2vw, 1.45rem);
      border-right: 2px solid rgba(188, 234, 255, 0.9);
      white-space: nowrap;
      overflow: hidden;
      animation: typing 5s steps(52) infinite, caret .7s step-end infinite;
      max-width: 92vw;
    }

    .cta-row { display: flex; justify-content: center; gap: .8rem; flex-wrap: wrap; }
    .btn {
      padding: .8rem 1.2rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.26);
      background: rgba(255,255,255,.08);
      color: #ecf8ff;
      text-decoration: none;
      font-weight: 500;
      transition: transform .35s cubic-bezier(.22,.61,.36,1), background .35s;
    }
    .btn:hover { transform: translateY(-4px); background: rgba(135,231,255,.2); }

    .slides {
      position: relative;
      z-index: 2;
      padding: 0 1rem 8rem;
    }

    .slide {
      width: min(1120px, 94vw);
      margin: 0 auto 1.4rem;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      background: rgba(10, 18, 35, 0.66);
      border: 1px solid rgba(158, 218, 255, 0.22);
      box-shadow: 0 20px 60px rgba(0,0,0,.46);
      transform: translateY(26px) scale(.98);
      opacity: 0;
      transition: opacity 900ms cubic-bezier(.22,.61,.36,1), transform 900ms cubic-bezier(.22,.61,.36,1);
      will-change: opacity, transform;
    }

    .slide.is-visible { opacity: 1; transform: translateY(0) scale(1); }

    .slide img {
      width: 100%;
      display: block;
      filter: saturate(1.1) contrast(1.04);
      transform: scale(1.02);
      transition: transform 5s ease;
    }

    .slide.is-visible img { transform: scale(1); }

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(109,230,255,.16), transparent 26%, transparent 74%, rgba(158,132,255,.2));
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .footer {
      text-align: center;
      color: #9eb8e8;
      padding: 1rem 1rem 4rem;
      position: relative;
      z-index: 2;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px);} to {opacity: 1; transform: translateY(0);} }
    @keyframes chromaShift { from { filter: hue-rotate(0deg);} to {filter: hue-rotate(20deg);} }
    @keyframes typing { 0%, 90%, 100% { width: 0; } 35%, 70% { width: 52ch; } }
    @keyframes caret { 50% { border-color: transparent; } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation: none !important; transition: none !important; }
      .slide { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <canvas class="particles" id="particles"></canvas>

  <header class="hero" id="top">
    <section class="glass">
      <p class="kicker">Cinematic Learning Experience</p>
      <h1>AI Literacy</h1>
      <p class="animated-typing">Productivity • Creativity • Responsibility • Future-Ready Thinking</p>
      <div class="cta-row">
        <a class="btn" href="#video">Watch Video</a>
        <a class="btn" href="./ai-literacy-course.mp4" download>Download MP4</a>
      </div>
    </section>
  </header>



  <section class="glass" id="video" style="width:min(1120px,94vw);margin:0 auto 2rem;position:relative;z-index:2;">
    <h2 style="margin-top:0">Course Video</h2>
    <video controls preload="metadata" style="width:100%;border-radius:16px;background:#000;" src="./ai-literacy-course.mp4"></video>
    <p style="color:#b8d8ff">If sound is muted, unmute the player and increase volume.</p>
    <a class="btn" href="./ai-literacy-course.mp4" download>Download MP4</a>
  </section>

  <main class="slides" id="slides">
    <article class="slide reveal"><img src="./slides/1TitlePage.png" alt="AI Literacy title slide" /></article>
    <article class="slide reveal"><img src="./slides/2InNotNow.png" alt="Experimental course slide" /></article>
    <article class="slide reveal"><img src="./slides/3intro.png" alt="Course introduction slide" /></article>
    <article class="slide reveal"><img src="./slides/4Assignment.png" alt="Assignment slide" /></article>
    <article class="slide reveal"><img src="./slides/5Thanks.png" alt="Thank you slide" /></article>
  </main>

  <footer class="footer">AI Literacy • Cinematic GitHub Pages Edition</footer>

  <script>
    const revealEls = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) entry.target.classList.add('is-visible');
      });
    }, { threshold: 0.18, rootMargin: '0px 0px -10% 0px' });
    revealEls.forEach((el) => observer.observe(el));

    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const particles = [];
    const particleCount = 90;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function makeParticle() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.4 + 0.4,
        v: Math.random() * 0.42 + 0.08,
        alpha: Math.random() * 0.55 + 0.15,
      };
    }

    function init() {
      particles.length = 0;
      for (let i = 0; i < particleCount; i++) particles.push(makeParticle());
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.y -= p.v;
        if (p.y < -10) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(132, 228, 255, ${p.alpha})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(132,228,255,0.8)';
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); init(); });
    resize();
    init();
    draw();
  </script>
</body>
</html>
