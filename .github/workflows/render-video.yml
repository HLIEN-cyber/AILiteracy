name: Render Remotion Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Render AIClassroom composition to MP4
        run: npx remotion@latest render src/index.ts AIClassroom out/ai-literacy.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v5
        with:
          name: ai-literacy-video
          path: out/ai-literacy.mp4
          if-no-files-found: error
