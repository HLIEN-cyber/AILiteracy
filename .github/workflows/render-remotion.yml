name: Render Remotion Video

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Node 24 action migration
        run: |
          echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=$FORCE_JAVASCRIPT_ACTIONS_TO_NODE24"
          if grep -R -nE "actions/(checkout|upload-artifact)@v4" .github/workflows; then
            echo "Found deprecated action version(s)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Render AIClassroom composition
        run: npx remotion@latest render src/index.ts AIClassroom out/ai-literacy.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v5
        with:
          name: ai-literacy-mp4
          path: out/ai-literacy.mp4
          if-no-files-found: error
